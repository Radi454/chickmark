name: hatchaudit
description: "ChickMark - Offline-first hatchery audit app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^0.4.5+2
  path: ^1.9.0
  provider: ^6.1.2
  fl_chart: ^0.70.0
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  image: ^4.8.0
  google_mlkit_text_recognition: ^0.15.1
  connectivity_plus: ^6.1.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_blue_plus: ^1.35.3
  animate_do: ^4.2.0
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_blue_plus_platform_interface: ^7.0.0
  mocktail: ^0.3.0
  sqflite_common_ffi: ^2.4.0+2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/chickmark-icon.png
    - assets/branding/chickmark-mark-onbrand.png
    - .env.json
